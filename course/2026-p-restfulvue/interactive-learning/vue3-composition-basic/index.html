const DATA={"chapters":[{"title":"ref()：單一狀態與 .value","sub":"ref、事件、模板自動解包","goal":"理解 ref 在 JavaScript 使用 .value，在模板中自動解包。","template":"<button @click=\"doubleCount\">數值加倍<\/button><p>目前數值：{{ count }}<\/p>","code":"const count = ref(1);\n\nfunction doubleCount() {\n  count.value = count.value + count.value;\n}\n\nreturn { count, doubleCount };","hint":"setup() 中的賦值只在初始化時執行；點擊事件必須透過 @click 呼叫函式。初始值設為 1，點擊後依序得到 2、4、8。"},{"title":"reactive()：表單狀態","sub":"reactive、物件屬性","goal":"使用 reactive 管理多欄位物件。","template":"<label>任務標題 <input v-model=\"form.title\"><\/label><label>分鐘 <input type=\"number\" v-model.number=\"form.minutes\"><\/label><pre>{{ JSON.stringify(form, null, 2) }}<\/pre>","code":"const form = reactive({\n  title: '學習 Vue 3',\n  minutes: 30\n});\n\nreturn { form };","hint":"試著修改標題與分鐘數，檢查 JSON 的資料型別。"},{"title":"v-model 修飾符","sub":"v-model.trim、v-model.number","goal":"比較 trim 去除前後空白及 number 數值轉型。","template":"<label>名稱 <input v-model.trim=\"name\"><\/label><label>分數 <input type=\"number\" v-model.number=\"score\"><\/label><p>名稱：{{ JSON.stringify(name) }}<\/p><p>分數：{{ score }}（{{ typeof score }}）<\/p>","code":"const name = ref(' Alex ');\nconst score = ref(85);\n\nreturn { name, score };","hint":"在名稱輸入前後空白後移開焦點，觀察 trim 的效果。"},{"title":"computed()：衍生狀態","sub":"computed、快取、完成率","goal":"使用 computed 自動計算衍生資料。","template":"<button @click=\"done++\" :disabled=\"done >= total\">完成一項<\/button><p>已完成 {{ done }} / {{ total }}<\/p><progress :value=\"rate\" max=\"100\"><\/progress> {{ rate }}%","code":"const total = ref(4);\nconst done = ref(1);\n\nconst rate = computed(() => {\n  return Math.round((done.value / total.value) * 100);\n});\n\nreturn { total, done, rate };","hint":"computed 會依賴響應式狀態重新計算，無須手動更新進度。"},{"title":"watch()：偵聽變化","sub":"watch、newVal、oldVal","goal":"監聽搜尋關鍵字，觀察新舊值。","template":"<input v-model=\"query\" placeholder=\"輸入搜尋字詞\"><ul><li v-for=\"(item,i) in logs\" :key=\"i\">{{ item }}<\/li><\/ul>","code":"const query = ref('');\nconst logs = ref([]);\n\nwatch(query, (next, prev) => {\n  logs.value.unshift(\n    '從 ' + JSON.stringify(prev) + ' 改為 ' + JSON.stringify(next)\n  );\n  logs.value = logs.value.slice(0, 5);\n});\n\nreturn { query, logs };","hint":"每次變更輸入值都會觸發 watch；實際 API 搜尋通常還需防抖處理。"},{"title":"v-if 與 v-for","sub":"條件渲染、列表、:key","goal":"以條件顯示內容，並使用 v-for 渲染列表。","template":"<button @click=\"visible = !visible\">切換顯示<\/button><ul v-if=\"visible\"><li v-for=\"task in tasks\" :key=\"task.id\">{{ task.title }}<\/li><\/ul><p v-else>清單已隱藏<\/p>","code":"const visible = ref(true);\nconst tasks = ref([\n  { id: 1, title: '閱讀教材' },\n  { id: 2, title: '練習程式' }\n]);\n\nreturn { visible, tasks };","hint":"v-if 會建立或移除 DOM；v-for 建議使用穩定且唯一的 :key。"},{"title":"事件與表單提交","sub":"@click、@submit.prevent","goal":"處理表單提交並避免頁面重新整理。","template":"<form @submit.prevent=\"add\"><input v-model.trim=\"title\" placeholder=\"新任務\"><button>新增<\/button><\/form><ul><li v-for=\"(task,i) in tasks\" :key=\"i\">{{ task }}<\/li><\/ul>","code":"const title = ref('');\nconst tasks = ref(['學習事件處理']);\n\nfunction add() {\n  if (!title.value) return;\n\n  tasks.value.push(title.value);\n  title.value = '';\n}\n\nreturn { title, tasks, add };","hint":"試著新增多筆任務，確認按下送出不會重整頁面。"},{"title":"整合實作：待辦清單","sub":"ref、reactive、computed、v-model、v-for","goal":"將原始範例的狀態、清單與完成率整合為小型應用。","template":"<form @submit.prevent=\"add\"><input v-model.trim=\"form.title\" placeholder=\"輸入任務\"><button>新增<\/button><\/form><p>完成率：{{ rate }}%<\/p><ul><li v-for=\"t in tasks\" :key=\"t.id\"><label><input type=\"checkbox\" v-model=\"t.completed\"> {{ t.title }}<\/label> <button @click=\"remove(t.id)\">刪除<\/button><\/li><\/ul>","code":"const form = reactive({ title: '' });\nconst tasks = ref([\n  { id: 1, title: '理解響應式', completed: true },\n  { id: 2, title: '完成練習', completed: false }\n]);\n\nconst rate = computed(() => {\n  if (tasks.value.length === 0) return 0;\n  const completed = tasks.value.filter(t => t.completed).length;\n  return Math.round((completed / tasks.value.length) * 100);\n});\n\nlet nextId = 3;\n\nfunction add() {\n  if (!form.title.trim()) return;\n  tasks.value.push({\n    id: nextId++,\n    title: form.title.trim(),\n    completed: false\n  });\n  form.title = '';\n}\n\nfunction remove(id) {\n  tasks.value = tasks.value.filter(t => t.id !== id);\n}\n\nreturn { form, tasks, rate, add, remove };","hint":"這個練習對應原始檔案中的任務新增、完成切換、刪除及進度統計。"}]};

DATA.chapters.forEach((c,i)=>{const n=i+1;const d=document.createElement('details');d.className='chapter';d.innerHTML=`<summary><span class="num">${String(n).padStart(2,'0')}</span><span class="heading"><strong>${esc(c.title)}</strong><small>${esc(c.sub)}</small></span><span class="arrow">⌄</span></summary><div class="content"><div class="goal"><strong>學習目標：</strong>${esc(c.goal)}</div><h3>互動程式碼編輯區（JavaScript｜setup() 函式內容）</h3><div class="code-shell"><pre aria-hidden="true"><code class="language-javascript"></code></pre><textarea spellcheck="false" aria-label="第${n}章程式碼"></textarea></div><h3>Template 編輯區（HTML｜Vue 模板語法）</h3><p class="status">可修改 HTML 標籤、Vue 指令與插值表達式，按「執行預覽」查看變化。</p><div class="code-shell"><pre aria-hidden="true"><code class="language-html"></code></pre><textarea class="template-editor" spellcheck="false" aria-label="第${n}章 Template 程式碼"></textarea></div><div class="runbar"><button class="run">▶ 執行預覽</button><button class="secondary reset">還原範例</button><span class="status">尚未執行</span></div><h3>即時執行結果</h3><div class="preview"><iframe title="第${n}章 Vue 預覽" sandbox="allow-scripts"></iframe></div><div class="note"><strong>💡 練習提示：</strong>${esc(c.hint)}</div><label class="complete"><input type="checkbox">我已學會本章</label></div>`;root.append(d);const t=d.querySelector('textarea:not(.template-editor)'),tt=d.querySelector('.template-editor'),code=d.querySelector('pre code'),pre=d.querySelector('pre'),tc=d.querySelectorAll('pre code')[1],tp=d.querySelectorAll('.code-shell pre')[1],status=d.querySelector('.status'),frame=d.querySelector('iframe');t.value=c.code;tt.value=c.template.replace(/></g,'>\n<');function paint(){code.className='language-javascript hljs';code.innerHTML=window.hljs?hljs.highlight(t.value,{language:'javascript',ignoreIllegals:true}).value:esc(t.value)+'\n';pre.scrollTop=t.scrollTop;pre.scrollLeft=t.scrollLeft;tc.className='language-html hljs';tc.innerHTML=window.hljs?hljs.highlight(tt.value,{language:'xml',ignoreIllegals:true}).value:esc(tt.value)+'\n';tp.scrollTop=tt.scrollTop;tp.scrollLeft=tt.scrollLeft}t.addEventListener('input',paint);tt.addEventListener('input',paint);tt.addEventListener('scroll',()=>{tp.scrollTop=tt.scrollTop;tp.scrollLeft=tt.scrollLeft});t.addEventListener('scroll',()=>{pre.scrollTop=t.scrollTop;pre.scrollLeft=t.scrollLeft});[t,tt].forEach(editor=>editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const a=editor.selectionStart,b=editor.selectionEnd;editor.setRangeText('  ',a,b,'end');paint()}}));paint();function run(){status.textContent='載入 Vue 3 並執行中…';const template=tt.value;const script=`<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"><\/script>`;const runner=`<script>document.getElementById('app').innerHTML=${JSON.stringify(template).replaceAll('<','\\u003c')};window.addEventListener('error',e=>{document.getElementById('error').textContent='執行錯誤：'+e.message});if(!window.Vue){document.getElementById('error').textContent='Vue CDN 載入失敗，請確認網路連線';}else{try{const {ref,reactive,computed,watch}=Vue;const setup=new Function('ref','reactive','computed','watch',${JSON.stringify(t.value)});Vue.createApp({setup(){return setup(ref,reactive,computed,watch)}}).mount('#app')}catch(e){document.getElementById('error').textContent=e.stack||e.message}}<\/script>`;frame.srcdoc=`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><style>body{font:15px/1.7 system-ui;padding:15px;color:#243248}button{padding:6px 12px;margin:4px;background:#2563eb;color:white;border:0;border-radius:6px;cursor:pointer}input{padding:7px;border:1px solid #bdc9d9;border-radius:6px;margin:5px}label{display:block}#error{color:#c02626;white-space:pre-wrap}progress{width:170px}
